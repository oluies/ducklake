name: NFR-004 — No new public C++ API
on:
  pull_request:
    paths:
      - 'src/include/**'

jobs:
  public-api-diff:
    name: Guard against unapproved public-API additions
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Detect new public-API symbols outside the sanctioned MSSQL header
      run: |
        set -euo pipefail
        base="${{ github.base_ref }}"
        git fetch origin "$base" --depth=1

        # Heuristic — only the high-signal cases (loose patterns produced too many
        # false positives in review).
        # Triggers ONLY when a diff adds a line that, after stripping leading
        # whitespace, starts with one of:
        #   - A new file under src/include/ (handled separately below).
        #   - A new TOP-LEVEL `class Foo` or `struct Foo` declaration (not nested,
        #     not a forward decl ending in `;`).
        #   - A new `virtual` member function declaration.
        # Comments, blank lines, forward declarations, and template specializations
        # of existing classes are intentionally NOT flagged — those don't widen
        # the public ABI in a way NFR-004 cares about.
        #
        # For real ABI tracking, run `abidiff` against a baseline shared library;
        # this workflow is a tripwire, not a substitute.

        scope=(
          'src/include/**'
          ':(exclude)src/include/metadata_manager/sqlserver_metadata_manager.hpp'
        )

        # 1. New files under src/include/ — always flag.
        new_files=$(git diff --diff-filter=A --name-only "origin/$base"...HEAD -- "${scope[@]}" || true)

        # 2. Added class/struct/virtual lines in modified files.
        # Match `+class Name` or `+struct Name` (NOT forward decls — require an opening
        # brace on the same line, or no semicolon ending), and `+virtual …(`.
        added=$(git diff "origin/$base"...HEAD -- "${scope[@]}" \
                 | grep -E '^\+(class|struct)\s+[A-Za-z_][A-Za-z0-9_]*\s*(:|$|\{)' \
                 | grep -v '^\+\+\+' || true)
        added_virtual=$(git diff "origin/$base"...HEAD -- "${scope[@]}" \
                 | grep -E '^\+\s*virtual\b' \
                 | grep -v '^\+\+\+' \
                 | grep -v '^\+\s*//' || true)

        findings=""
        if [ -n "$new_files" ]; then
          findings="New header files (Constitution Principle I: no new public API):
        ${new_files}

        "
        fi
        if [ -n "$added" ]; then
          findings="${findings}New top-level class/struct declarations:
        ${added}

        "
        fi
        if [ -n "$added_virtual" ]; then
          findings="${findings}New virtual member functions:
        ${added_virtual}
        "
        fi

        if [ -n "$findings" ]; then
          echo "::warning title=NFR-004 tripwire::Possible public-API additions outside src/include/metadata_manager/sqlserver_metadata_manager.hpp. Review manually and run abidiff for authoritative signal."
          printf '%s\n' "$findings"
          # Soft gate by default — flip to `exit 1` to make this blocking.
          exit 0
        fi

        echo "No public-API additions detected outside the sanctioned MSSQL header."
