name: DBMS Catalog Tests — SQL Server (Linux)
on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'specs/**'
      - '**.md'
      - 'CLAUDE.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'specs/**'
      - '**.md'
      - 'CLAUDE.md'
  repository_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Build once. Both SQL Server matrix legs (2019 + 2022) consume the same artifact,
  # avoiding two cold builds per PR.
  build:
    name: Build DuckLake + mssql extension (Linux)
    runs-on: ubuntu-latest
    env:
      VCPKG_TARGET_TRIPLET: x64-linux
      GEN: Ninja
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      ENABLE_MSSQL: ON
      BUILD_EXTENSION_TEST_DEPS: full
      DUCKLAKE_CI: 1

    steps:
    - name: Install required ubuntu packages
      run: |
        sudo apt-get update -y -qq
        sudo apt-get install -y -qq build-essential cmake ninja-build ccache python3 mold

    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
        submodules: 'true'

    - name: Cache duckdb submodule checkout
      uses: actions/cache@v4
      with:
        path: duckdb
        key: duckdb-${{ runner.os }}-${{ hashFiles('.github/duckdb-version') }}

    - name: Checkout DuckDB to version
      run: |
        cd duckdb
        git checkout $(cat ../.github/duckdb-version)

    - name: Setup Ccache
      uses: hendrikmuhs/ccache-action@main
      with:
        key: ${{ github.job }}-mssql-linux
        save: ${{ github.ref == 'refs/heads/main' || github.repository != 'duckdb/ducklake' }}

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11.1
      with:
        vcpkgGitCommitId: 84bab45d415d22042bd0b9081aea57f362da3f35

    - name: Build extension
      env:
        GEN: ninja
      run: |
        make release CMAKE_FLAGS="-DENABLE_MSSQL=ON"

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: mssql-build-linux
        path: |
          build/release/duckdb
          build/release/test/unittest
          build/release/extension/**/*.duckdb_extension
          build/release/repository/**
        retention-days: 1

  test:
    name: Test against SQL Server ${{ matrix.mssql_version }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mssql_version: ['2019', '2022']

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:${{ matrix.mssql_version }}-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "DuckLake!2026"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'DuckLake!2026' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      DUCKLAKE_CI: 1
      DUCKLAKE_MSSQL_CONNSTR: "Server=localhost,1433;Database=ducklakedb;User Id=sa;Password=DuckLake!2026;TrustServerCertificate=true;"

    steps:
    - uses: actions/checkout@v3
      with:
        # Shallow — we need the tests + configs, not full history.
        fetch-depth: 1

    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: mssql-build-linux
        path: build/release/

    - name: Restore unittest binary executable bit
      run: chmod +x build/release/duckdb build/release/test/unittest

    - name: Wait for SQL Server
      run: |
        for i in {1..30}; do
          docker exec $(docker ps -q --filter "ancestor=mcr.microsoft.com/mssql/server:${{ matrix.mssql_version }}-latest") \
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'DuckLake!2026' -C -Q "SELECT 1" && break || sleep 2
        done

    - name: Create ducklakedb database
      run: |
        docker exec $(docker ps -q --filter "ancestor=mcr.microsoft.com/mssql/server:${{ matrix.mssql_version }}-latest") \
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'DuckLake!2026' -C -Q "CREATE DATABASE ducklakedb"

    - name: Test SQL Server
      run: |
        build/release/test/unittest --test-config test/configs/sqlserver.json --test-dir ./ "test/sql/*" | tee mssql-results.txt

    - name: Compute ratio vs postgres (SC-001 gate)
      if: always()
      run: |
        # T031a — fail if passed_sqlserver / passed_postgres < 0.95.
        # The postgres baseline is fetched from the latest successful Catalogs workflow on main.
        # If no baseline is available (first run), skip the gate but warn.
        if [ -f mssql-results.txt ]; then
          passed_mssql=$(grep -E "^[0-9]+ assertions in [0-9]+ test cases" mssql-results.txt | awk '{print $4}' || echo 0)
          echo "passed_mssql=${passed_mssql}"
          # Baseline retrieval is environment-specific; replace with org-specific fetch.
          passed_postgres="${PASSED_POSTGRES_BASELINE:-0}"
          if [ "${passed_postgres}" -eq 0 ]; then
            echo "::warning ::No postgres baseline available — skipping ratio gate."
            exit 0
          fi
          ratio=$(awk -v m="${passed_mssql}" -v p="${passed_postgres}" 'BEGIN { print (m / p) }')
          echo "ratio=${ratio}"
          awk -v r="${ratio}" 'BEGIN { exit (r >= 0.95) ? 0 : 1 }' \
            || { echo "::error ::passed_sqlserver / passed_postgres = ${ratio} < 0.95"; exit 1; }
        fi
