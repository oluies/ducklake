services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ducklake-mssql-2022
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "DuckLake!2026"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'DuckLake!2026' -C -Q 'SELECT 1' || exit 1"
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mssql-data:
